<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vídeos com HTML5</title>
</head>
<body>
    <h1>Inserindo vídeos hospedados localmente</h1>
    <p>Este vídeo está hospedado no meu próprio servidor.</p>

    <!-- <video src="midia/meu-video.mp4.mp4" width="300" controls></video> -->
     <video width="300" controls>
        <source src="midia/meu-video.mp4.mp4" type="video/mp4">
        <source src="midia/meu-video.mp4.m4v" type="video/mp4">
        <source src="midia/meu-video.mp4.webm" type="video/mp4">
        <source src="midia/meu-video.mp4.ogv" type="video/mp4">
        <p>Seu computador não tem compatibilidade com reprodução de vídeos.</p>
     </video>

     <h1>Inserindo vídeos do Youtube</h1>
     <iframe width="560" height="315" src="https://www.youtube.com/embed/3hng-hmSv2Y?si=vxUq8X14ObYtDZIP" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
</body>
</html>
